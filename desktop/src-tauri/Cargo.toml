[package]
name = "aurachat"
version = "0.1.6"
description = "AuraChat desktop gateway (tray + inferenza OpenAI-compatible)"
edition = "2021"

[lib]
name = "aurachat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
reqwest = { version = "0.12", features = ["json"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
transcribe-rs = { version = "=0.3.12", default-features = false, features = ["whisper-vulkan"] }
kokoro-micro = "=1.3.0"
sha2 = "0.10"
base64 = "0.22"
ort = "=2.0.0-rc.12"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
rmcp = { version = "3.6", default-features = false, features = ["client", "auth", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest-native-tls"] }
mcp-http = { package = "reqwest", version = "0.13", default-features = false, features = ["native-tls"] }
tokio = { version = "1", features = ["process", "time", "sync", "net", "io-util"] }
async-trait = "0.1"
portable-pty = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
windows = { version = "0.62.2", features = ["Media_Control", "Win32_System_WinRT", "Win32_System_Threading", "Win32_System_Com", "Win32_UI_Shell", "Win32_Security_Cryptography"] }
# Same version wry uses: captures the internal browser page through WebView2.
webview2-com = "0.39"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

# Model verification hashes 3 GB; keep SHA-256 fast in desktop dev builds too.
[profile.dev.package.sha2]
opt-level = 3
